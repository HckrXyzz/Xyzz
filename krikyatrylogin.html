<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>KRIKYA TRY LOGIN </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .btnContainer {
            width: 300px;
        }

        .sidebarIcon {
            max-width: 20px;
            max-height: 30px;
            background-image: url("");
        }

        #fileContent {
            max-height: 200px;
            text-decoration: none;
            font-size: xx-small;
            display: none;
        }

        header {
            max-height: 100px;
        }

        #myLogo {
            border: 10px solid #2d2d2d;
            border-radius: 50px;
            box-sizing: border-box;
            box-shadow: inset 1px 5px 5px rgb(10, 10, 10);
        }

        .hidden {
            display: none;
        }

        .logoContainer {
            border: 20px solid #3633336b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 500px;
            height: 500px;
            margin: 100px;
            padding: 10px;
            box-shadow: inset 1px 5px 5px rgb(10, 10, 10);
        }

        .word-item {
            text-shadow: 1px 1px 1px #070707;
        }

        .middle {
            background-size: cover;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 20px solid #3633336b;
            border-radius: 100px;
            justify-content: center;
            align-items: center;
            box-shadow: 1px 5px 5px rgb(10, 10, 10);
        }

        main {
            margin-bottom: 100px;
            margin-top: 100px;
            min-height: 100vh;
            width: 100%;
        }

        #textInput {
            resize: none;
            margin-top: 10px;
            border: 1px dashed #5a5555d1;
            height: 100px;
        }

        #mainButton {
            height: 100px;
            width: 100px;
            border-radius: 40px;
            border: 20px solid;
            text-align: center;
            text-shadow: 1px 1px 2px #000;
            font-size: larger;
            font-weight: bolder;
        }

        #myInput .messageBox {
            width: fit-content;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2d2d2d;
            padding: 0 15px;
            border-radius: 10px;
            border: 1px solid rgb(63, 63, 63);
        }

        #myInput .messageBox:focus-within {
            border: 1px solid rgb(110, 110, 110);
        }

        #myInput .fileUploadWrapper {
            width: fit-content;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        #myInput #fileInput {
            display: none;
        }

        #myInput .fileUploadWrapper label {
            cursor: pointer;
            width: fit-content;
            height: fit-content;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #myInput .fileUploadWrapper label svg {
            height: 18px;
        }

        #myInput .fileUploadWrapper label svg path {
            transition: all 0.3s;
        }

        #myInput .fileUploadWrapper label svg circle {
            transition: all 0.3s;
        }

        #myInput .fileUploadWrapper label:hover svg path {
            stroke: #fff;
        }

        #myInput .fileUploadWrapper label:hover svg circle {
            stroke: #fff;
            fill: #3c3c3c;
        }

        #myInput .fileUploadWrapper label:hover .tooltip {
            display: block;
            opacity: 1;
        }

        #myInput .tooltip {
            position: absolute;
            top: -40px;
            display: none;
            opacity: 0;
            color: white;
            font-size: 10px;
            white-space: nowrap;
            background-color: #000;
            padding: 6px 10px;
            border: 1px solid #3c3c3c;
            border-radius: 5px;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.596);
            transition: all 0.3s;
        }

        #myInput #messageInput {
            width: 200px;
            height: 100%;
            background-color: transparent;
            outline: none;
            border: none;
            padding-left: 10px;
            color: white;
        }

        #myInput #messageInput:focus~#sendButton svg path,
        #messageInput:valid~#sendButton svg path {
            fill: #3c3c3c;
            stroke: white;
        }

        #myInput #sendButton {
            width: fit-content;
            height: 100%;
            background-color: transparent;
            outline: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        #myInput #sendButton svg {
            height: 18px;
            transition: all 0.3s;
        }

        #myInput #sendButton svg path {
            transition: all 0.3s;
        }

        #myInput #sendButton:hover svg path {
            fill: #3c3c3c;
            stroke: white;
        }
    </style>
</head>

<body>
    <header class="fixed-top container-fluid bg-dark border">
        <button class="btn btn-menu" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
            <div class="btn btn-outline-danger">
                <img src="https://hckrxyzz.github.io/image/sidebar.svg" type="image/svg" width="20" alt="≡">
            </div>
        </button>
        <button type="button" class="btn btn-outline-danger" id="stopButton">STOP</button>

    </header>

    <div class="modal fade" id="inputViewer" tabindex="-1" aria-labelledby="inputViewerLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-secondary">
                    <h5 class="modal-title" id="inputViewerLabel">INPUT TEXT</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="fileContent" class="container-fluid">
                        <!-- File content will be displayed here -->
                    </div>
                </div>
                <div class="container-fluid mt-3" style="margin-bottom: 100px;">
                    <h2 class="bg-danger text-center text-dark text-shadow">INPUT MEMBERCODES</h2>
                    <div id="wordListContainer"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" id="sidebar">
        <div class="offcanvas-header bg-secondary">
            <h1 class="offcanvas-title btn btn-outline-info">
                <span class="spinner-grow spinner-grow-sm"></span>
                <button type="button" class="btn btn-outline-danger">BUTTON EXAMPLE</button><span
                    class="spinner-grow spinner-grow-sm"></span>
            </h1>
            <button type="button" class="btn btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body btnContainer d-grid btn-group-vertical gap-3" id="btnContainer">
            <button id="btn6" type="button" class="btn btn-outline-primary">Button 6</button>
            <button class="btn btn-secondary" type="button">AButton</button>
            <button type="button" class="btn btn-primary btn-block">Full-Width Button</button>
            <button type="button" class="btn btn-primary active">Active Primary</button>
        </div>
    </div>

    <main>
        <div class="container-fluid">
            <label for="fileInput"></label>
            <input type="file" id="fileInput" accept=".txt">
            <input type="button" class="btn btn-close" onclick="clearInput()" title="clearInput">
            <label for="textInput"></label>
            <textarea id="textInput" class="container-fluid bg-black shadow border-radius border" spellcheck="false"
                placeholder="Paste your text here..."></textarea>
            <div class="container-fluid text-start btn btn-outline-success">
                <div id="memberStats" class="stats"></div>
                <div class="container-fluid" id="userList"></div>
                <div id="wordStats"></div>
            </div>
        </div>
        <div class="main mainContent" id="mainContent">
            <div class="p-5 text-white text-center">
                <h1 class="bg-dark">WELCOME</h1>
                <p class="text-center">To PiNik</p>
            </div>
            <div class="container-fluid border">
                <table class="table table-dark table-hover table-bordered table-stripe">
                    <thead>
                        <tr class="text-center table-danger">
                            <th>USERNAME</th>
                            <th>WALLET</th>
                            <th>BALANCE</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="container-fluid mt-3" style="margin-bottom: 100px;">
                    <h2 class="bg-danger text-center text-dark text-shadow">SUCCESSFULL MEMBERCODES</h2>
                    <div class="row" id="successOutput"></div>
                </div>
            </div>
        </div>
            <footer class="fixed-bottom">
                    <div class="mt-5 p-4 text-center">
                        <input type="button" class="btn btn-outline-danger mainButton" id="mainButton" title="MAIN"
                            value="▢">
                    </div>
                </footer>

                <script>
                    document.getElementById('fileInput').addEventListener('change', function (event) {
                        const file = event.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function (e) {
                                document.getElementById('fileContent').innerText = e.target.result;
                            };
                            reader.readAsText(file);
                            const modal = new bootstrap.Modal(document.getElementById('inputViewer'));
                            modal.show();
                        }
                    });
                    function clearInput() {
                        document.getElementById('fileInput').value = "";
                        document.getElementById('textInput').value = "";
                    }
                </script>
                <script>
                    function popupMyphoto() {
                        const logoModal = new bootstrap.Modal(document.getElementById('logoModal'));
                        logoModal.show();
                    };
                </script>

                <script src="https://hckrxyzz.github.io/js/wordgenarate.js"></script>
                <script src="https://hckrxyzz.github.io/js/krikyatrylogin.js"></script>
         <script src="https://hckrxyzz.github.io/js/a.js"></script>

</body>

</html>
