<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRIKYA TRY LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" />
    <link rel="stylesheet" href="https://hckrxyzz.github.io/css/a.css" />
    <style>
      #loading {
        background-image:url(https://i.pinimg.com/originals/68/1d/d2/681dd2c6e0f1b52a9a5dc7c995b14ef2.gif);
        background-size:cover;
        width:300px;
        height:300px;
        margin:10px;
      }
    </style>
  </head>
  <body class="bg-dark">
    <header class="fixed-top header">
      <button
        type="button"
        class="btn btn-outline-danger"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebar"
        aria-label="Open sidebar"
      >
        <img
          src="https://hckrxyzz.github.io/image/sidebar.svg"
          width="20"
          alt="Open sidebar menu"
        />
      </button>
      <button
        type="button"
        class="profile-btn btn btn-danger"
        data-bs-toggle="offcanvas"
        data-bs-target="#profile"
        aria-label="Open profile"
      >
        <span class="adminID">ADMIN PROFILE</span>
      </button>
    </header>
    <main>
      <aside class="offcanvas offcanvas-start card" id="sidebar">
        <div class="offcanvas-header">
          <button
            type="button"
            class="btn btn-close"
            data-bs-dismiss="offcanvas"
          ></button>
        </div>
        <div class="offcanvas-body btnContainer d-grid btn-group-vertical">
          <button type="button" class="btn btn-outline-primary">
            ID SEARCH
          </button>
          <button type="button" class="btn btn-danger btn-block">
            ID RESET
          </button>
          <button type="button" class="btn btn-primary active"></button>
        </div>
      </aside>

      <div id="mainContent" class="mt-3">
        <div class="text-white text-center bg-dark">
          <h1 class="border">KRIKYA ID SEARCH</h1>
        </div>
        <!-- Loader container -->
        <div class="loader_container" id="loading">
          <div
            class="bg-dark text-center"
            style="display: inline-block; width: 100%"
          >
            <span class="text-danger text-shadow text-uppercase">
              <span class="scrolling-text">....L o a d i n g.....</span>
            </span>
          </div>
        </div>
        <div class="container-fluid mt-3">
          <label for="fileInput"></label>
          <input type="file" id="fileInput" class="textInput text-white" />
          <input
            type="button"
            class="btn btn-close"
            title="clearInput"
            id="clearInput"
            value=""
          />
        </div>
        <div class="container-fluid mt-3 border-top">
          <div class="d-flex justify-content-between p-4 mb-2"><h2>Input TEXT</h2><button type="button" class="copyBtn btn btn-outline-secondary">&#x2398;</button></div>
          <label for="textInput"></label>
          <textarea
            id="textInput"
            class="container card bg-black shadow border-radius border"
            spellcheck="false"
            placeholder="Paste your text here..."
          ></textarea>
          <div class="container-fluid text-start">
            <div id="memberStats" class="stats"></div>
            <div class="card container" id="userList"></div>
            <div id="wordStats"></div>
          </div>
        </div>
        <div class="main mainContent">
          <div class="container-fluid border">
            <table
              class="table table-dark table-hover table-bordered table-stripe"
            >
              <thead>
                <tr class="text-center">
                  <th>USERNAME</th>
                  <th>WALLET</th>
                  <th>BALANCE</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
            <div class="container-fluid mt-3" style="margin-bottom: 100px">
<div class="d-flex justify-content-between p-4 mb-2">
              <h2 class="bg-danger text-center text-white text-shadow">
                SUCCESSFULL MEMBERCODES
              </h2>
              <button type="button" class="copyBtn btn btn-outline-secondary">&#x2398;</button>
</div>
              <div class="row" id="successOutput"></div>
            </div>
          </div>
        </div>

        <div
          class="modal fade"
          id="inputViewer"
          tabindex="-1"
          aria-labelledby="inputViewerLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header bg-dark">
                <h5 class="modal-title" id="inputViewerLabel">INPUT TEXT</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <div id="fileContent" class="container-fluid text-white">
                  <!-- File content will be displayed here -->
                </div>
              </div>
              <div class="container-fluid mt-3" style="margin-bottom: 100px">
                <h2 class="bg-danger text-center text-dark text-shadow">
                  INPUT MEMBERCODES
                </h2>
                <div id="wordListContainer"></div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- Admin for Profile -->
        <div class="offcanvas offcanvas-end card" id="profile">
          <div class="offcanvas-header">
            <span class="spinner-grow spinner-grow-sm"></span>
            <button type="button" class="btn btn-outline-danger">
              <span class="adminID">ADMIN</span>
            </button>
            <button
              type="button"
              class="btn btn-close"
              data-bs-dismiss="offcanvas"
            ></button>
          </div>
        </div>
      </div>
    </main>
    <footer class="fixed-bottom">
      <button
        type="button"
        class="btn btn-outline-danger mainButton"
        id="mainButton">
        ATTACK
      </button>
      <button
        type="button"
        class="btn btn-outline-danger"
        id="stopButton"
      >
        STOP
      </button>
    </footer>
    <script src="https://hckrxyzz.github.io/js/wordgenarate.js"></script>
    <script src="https://hckrxyzz.github.io/js/krikyatrylogin.js"></script>
    <script src="https://hckrxyzz.github.io/js/a.js"></script>
  </body>
</html>
