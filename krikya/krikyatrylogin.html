<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRIKYA TRY LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #00ffcc;
            font-family: "Fira Code", monospace, Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        #textInput {
            width: 100%;
            height: 200px;
            margin-top: 20px;
            resize: none;
            background-color: #1a1a1a;
            color: #aaf803;
            box-shadow: 0 0 15px #00ffcc;

        }

        #fileInput {
            margin-top: 20px;
            background-color: #1a1a1a;
            box-sizing: border-box;
            border: 2px dashed #000;
            box-shadow: 0 0 15px #00ffcc;

        }

        button {
            cursor: pointer;
            padding: 10px;
            margin: 10px;
            box-shadow: 0 0 15px #00ffcc;

        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #212121;
            box-shadow: 0 0 15px #00ffcc;

        }

        #mainButton {
            left: 0;
            width: 50%;
            height: 60px;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 112px;
            background-color: #000;
            box-shadow: 0 0 15px #00ffcc;

        }

        #stopButton {
            right: 0;
            width: 40%;
            height: 60px;
            background-color: #000;
            border-radius: 112px;
            box-shadow: 0 0 15px #00ffcc;

        }

        main {
            margin-top: 100px;
            margin-bottom: 100px;
            box-shadow: 0 0 15px #00ffcc;

        }

        @keyframes scroll-left {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }
    </style>
    <style>
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                color: #00ffcc;
                font-family: "Fira Code", monospace, Arial, sans-serif;
                min-height: 100vh;
            }

            header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 1000;
                height: 100px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 20px;
                background-color: #000;
                box-shadow: 0 0 15px #00ffcc;
            }

            .btnContainer {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .btnContainer button {
                width: 100%;
            }

            main {
                margin-top: 100px;
                margin-bottom: 100px;
                box-shadow: 0 0 15px #00ffcc;

            }

            footer {
                position: fixed;
                bottom: 0;
                width: 100%;
                z-index: 1000;
                height: 100px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #textInput {
                width: 100%;
                height: 200px;
                margin-top: 20px;
                resize: none;
                background-color: #1a1a1a;
                color: #aaf803;
                box-shadow: 0 0 15px #00ffcc;

            }
        }
    </style>
</head>

<body>
    <header class="fixed-top">
        <button type="button" class="btn btn-outline-danger" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
            aria-label="Open sidebar">
            <img src="https://hckrxyzz.github.io/image/sidebar.svg" width="20" alt="Open sidebar menu">
        </button>
        <button type="button" class="profile-btn btn btn-danger" data-bs-toggle="offcanvas" data-bs-target="#profile"
            aria-label="Open profile">
            <span class="adminID">ADMIN</span>
        </button>
    </header>
    <main data-bs-theme="dark">
        <aside class="offcanvas offcanvas-start card" id="sidebar">
            <div class="offcanvas-header">
                <button type="button" class="btn btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body btnContainer d-grid btn-group-vertical gap-3">
                <button type="button" class="btn btn-outline-primary">ID SEARCH</button>
                <button type="button" class="btn btn-danger btn-block">ID RESET</button>
                <button type="button" class="btn btn-primary active"></button>
            </div>
        </aside>

        <div id="mainContent">
            <div class="text-white text-center bg-dark">
                <h1 class="border">KRIKYA ID SEARCH</h1>
            </div>
            <div class="loader_container" id="loading"
                style="overflow: hidden; white-space: nowrap; width: 100%; display: none;">
                <div class="bg-dark  text-center"
                    style="display: inline-block; width: 100%; animation: scroll-left 18s linear infinite;"><span
                        class="text-danger text-shadow text-uppercase">....L o a d i n g.....</span>
                </div>
            </div>
            <div class="container-fluid">
                <label for="fileInput"></label>
                <input type="file" id="fileInput" accept=".txt">
                <input type="button" class="btn btn-close" title="clearInput" id="clearInput" value="">
                <label for="textInput"></label>
                <textarea id="textInput" class="container card bg-black shadow border-radius border" spellcheck="false"
                    placeholder="Paste your text here..."></textarea>
                <div class="container-fluid text-start">
                    <div id="memberStats" class="stats"></div>
                    <div class="card container" id="userList"></div>
                    <div id="wordStats"></div>
                </div>
            </div>
            <div class="main mainContent">

                <div class="container-fluid border">
                    <table class="table table-dark table-hover table-bordered table-stripe">
                        <thead>
                            <tr class="text-center">
                                <th>USERNAME</th>
                                <th>WALLET</th>
                                <th>BALANCE</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="container-fluid mt-3" style="margin-bottom: 100px;">
                        <h2 class="bg-danger text-center text-dark text-shadow">SUCCESSFULL MEMBERCODES</h2>
                        <div class="row" id="successOutput"></div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="inputViewer" tabindex="-1" aria-labelledby="inputViewerLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header bg-secondary">
                            <h5 class="modal-title" id="inputViewerLabel">INPUT TEXT</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div id="fileContent" class="container-fluid">
                                <!-- File content will be displayed here -->
                            </div>
                        </div>
                        <div class="container-fluid mt-3" style="margin-bottom: 100px;">
                            <h2 class="bg-danger text-center text-dark text-shadow">INPUT MEMBERCODES</h2>
                            <div id="wordListContainer"></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Admin for Profile -->
            <div class="offcanvas offcanvas-end card" id="profile">
                <div class="offcanvas-header">
                    <span class="spinner-grow spinner-grow-sm"></span>
                    <button type="button" class="btn btn-outline-danger">
                        <span class="adminID">ADMIN</span></button>
                    <button type="button" class="btn btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
            </div>
        </div>
    </main>
    <footer class="fixed-bottom">
        <button type="button" class="btn btn-outline-danger mainButton" id="mainButton">ATTACK</button>
        <button type="button" class="btn btn-outline-danger mainButton" id="stopButton">STOP</button>
    </footer>
<script>
// Function to perform background activity, e.g., sending a keep-alive request
function keepAlive() {
  // Replace this with your actual activity, e.g., fetch to server
  fetch('/keep-alive')
    .then(response => {
      // Optional: handle response
      console.log('Keep-alive ping sent.');
    })
    .catch(error => {
      console.error('Error sending keep-alive:', error);
    });
}

// Set the interval for periodic activity (e.g., every 60 seconds)
const intervalTime = 60000; // milliseconds

// Variable to hold the interval ID
let keepAliveInterval = null;

// Function to start the periodic activity
function startKeepAlive() {
  if (!keepAliveInterval) {
    keepAliveInterval = setInterval(keepAlive, intervalTime);
  }
}

// Function to stop the periodic activity if needed
function stopKeepAlive() {
  if (keepAliveInterval) {
    clearInterval(keepAliveInterval);
    keepAliveInterval = null;
  }
}

// Optional: pause activity when tab is hidden, resume when visible
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopKeepAlive();
  } else {
    startKeepAlive();
  }
});

// Start activity immediately when page loads
window.addEventListener('load', () => {
  startKeepAlive();
});
</script>
    <script src="https://hckrxyzz.github.io/js/wordgenarate.js"></script>
    <script src="https://hckrxyzz.github.io/js/krikyatrylogin.js"></script>
    <script src="https://hckrxyzz.github.io/js/a.js"></script>
</body>

</html>
