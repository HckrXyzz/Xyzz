<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiNiK Dashboard</title>
     <script src="https://hckrxyzz.github.io/js/a.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');

        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-purple: #9d00ff;
            --neon-green: #00ff9d;
            --dark-bg: #0f0f1a;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }

        .neon-glow {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        .neon-box {
            box-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue);
        }

        .neon-pink {
            box-shadow: 0 0 5px var(--neon-pink), 0 0 15px var(--neon-pink);
        }

        .neon-purple {
            box-shadow: 0 0 5px var(--neon-purple), 0 0 15px var(--neon-purple);
        }

        .neon-green {
            box-shadow: 0 0 5px var(--neon-green), 0 0 15px var(--neon-green);
        }

        .sidebar {
            background: rgba(15, 15, 26, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .sidebar-item {
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: rgba(0, 255, 255, 0.1);
            border-left: 3px solid var(--neon-blue);
        }

        .header {
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            box-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }

        .content-section {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .content-section.active {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .clock {
            font-weight: 300;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue);
            }

            50% {
                box-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            }

            100% {
                box-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .textarea-neon,
        .file-input-label {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .textarea-neon:focus {
            box-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }

        .file-input {
            display: none;
        }

        .file-input-label:hover {
            box-shadow: 0 0 5px var(--neon-purple), 0 0 15px var(--neon-purple);
            border: 1px solid var(--neon-purple);
        }

        .notification-badge {
            background-color: var(--neon-pink);
            position: absolute;
            top: -5px;
            right: -5px;
        }
    </style>
</head>

<body>

            <div class="relative">
                <button type="button" class="text-white hover:text-cyan-400 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

   <aside id="sidebar" class="sidebar fixed top-16 left-0 w-64 h-full bg-gray-800 text-white z-40 transition-transform transform -translate-x-full md:translate-x-0">

        <button type="button"

    </aside>


    <main class="pt-20 pb-8 px-4 md:px-8 ml-0 md:ml-64 transition-all duration-300">

                        class="textarea-neon bg-black hover:neon-glow w-full h-40 p-3 border-gray-800 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter your text here..."></textarea>

            </div>
            <div

                <!-- Processed result view with copy button -->

                        class="bg-black p-4 m-3 rounded-lg neon-box neon-glow text-xl uppercase text-black text-shadow">button</button>

        <section id="attackPage" class="content-section">

                    Overview</h2>

            </div>
        </section>
    </main>


    <script>
        // Digital Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'

            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
            setTimeout(updateClock, 1000);
        }
        updateClock();

        // Sidebar Toggle
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const main = document.querySelector('main');
        let sidebarOpen = window.innerWidth >= 768;

        function updateSidebar() {
            if (sidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                if (window.innerWidth >= 768) {
                    main.classList.remove('ml-0');
                    main.classList.add('ml-64');
                }
            } else {
                sidebar.classList.add('-translate-x-full');
                main.classList.remove('ml-64');
                main.classList.add('ml-0');
            }
        }

        if (window.innerWidth < 768) {
            sidebarOpen = false;
            updateSidebar();
        }

        sidebarToggle.addEventListener('click', () => {
            sidebarOpen = !sidebarOpen;
            updateSidebar();
        });

        // Content Section Navigation
        const sidebarItems = document.querySelectorAll('.sidebar-item');
        const contentSections = document.querySelectorAll('.content-section');

        sidebarItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();

                // Remove active class from all sidebar items
                sidebarItems.forEach(i => i.classList.remove('active'));

                // Add active class to clicked item
                item.classList.add('active');

                // Hide all content sections
                contentSections.forEach(section => {
                    section.classList.remove('active');
                });

                // Show the selected content section
                const sectionId = item.getAttribute('data-section');
                const targetSection = document.getElementById(sectionId);

                setTimeout(() => {
                    targetSection.classList.add('active');
                }, 100);

                // Close sidebar on mobile after selection
                if (window.innerWidth < 768) {
                    sidebarOpen = false;
                    updateSidebar();
                }
            });
        });

        // File input handling
        const fileUpload = document.getElementById('fileInput');
        if (fileUpload) {
            fileUpload.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    // You would typically upload the files here
                    alert(`Selected ${e.target.files.length} file(s)`);
                }
            });
        }

        // Responsive handling
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                if (sidebarOpen) {
                    main.classList.remove('ml-0');
                    main.classList.add('ml-64');
                }
            } else {
                main.classList.remove('ml-64');
                main.classList.add('ml-0');
            }
        });

        function viewMeberDetails() {
            const jsonTableButton = document.getElementById('jsonTable');
            jsonTableButton.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', () => {
                    const id = button.parentElement.parentElement.firstElementChild.textContent;
                    alert('User ID: ' + id);
                });
            });
        }
        document.addEventListener('DOMContentLoaded', viewMeberDetails);
    </script>
