<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xyzz Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');

    :root {
      --neon-pink: #ff00ff;
      --neon-blue: #00ffff;
      --neon-purple: #9d00ff;
      --neon-green: #00ff9d;
      --dark-bg: #0f0f1a;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--dark-bg);
      color: white;
      overflow-x: hidden;
    }

    .neon-glow {
      text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--neon-blue), 0 0 20px var(--neon-blue);
    }

    /* ... (keep your existing styles) ... */

    .content-section {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
    }

    .content-section.active {
      opacity: 1;
      transform: translateY(0);
      display: block;
    }

    /* ... rest of your styles ... */

    /* Ensure the sidebar toggle button is above other content */
    #sidebar-toggle {
      z-index: 999;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header fixed top-0 left-0 right-0 h-16 z-50 flex items-center justify-between px-4 bg-gray-950 backdrop-blur shadow-xl shadow-black">
    <div class="flex items-center">
      <button id="sidebar-toggle" class="mr-4 text-white hover:text-cyan-400 transition-colors focus:outline-none" aria-label="Toggle Sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 class="text-xl font-bold neon-glow">XyZz<span class="text-cyan-400">Hub</span></h1>
    </div>

    <div class="flex-1 mx-8">
      <div class="relative">
        <input type="text" placeholder="Search..." id="search-input" name="search" autocomplete="off"
               class="search-bar w-full py-2 px-4 rounded-full text-white outline-none"/>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute right-3 top-2.5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <div class="flex items-center space-x-6">
      <div id="clock" class="clock text-cyan-400 hidden md:block">Loading...</div>

      <div class="relative">
        <button type="button" class="text-white hover:text-cyan-400 transition-colors relative" aria-label="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <div class="notification-badge w-4 h-4 flex items-center justify-center rounded-full text-xs bg-neon-pink absolute top-0 right-0 transform translate-x-1/2 -translate-y-1/2">3</div>
        </button>
      </div>

      <div class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500 flex items-center justify-center cursor-pointer pulse">
        <a class="text-sm font-bold" href="#profile" title="Profile">JB</a>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed top-16 left-0 w-64 h-full bg-gray-800 text-white z-40 transition-transform transform -translate-x-full md:translate-x-0">
    <nav class="py-4">
      <div class="px-4 py-2 text-xs text-gray-400 uppercase">Main Menu</div>
      <a href="#dashboard" class="sidebar-item flex items-center px-4 py-3 text-white hover:text-cyan-400 active" data-section="dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a href="#attackPage" class="sidebar-item flex items-center px-4 py-3 text-white hover:text-cyan-400" data-section="attackPage">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        ATTACK
      </a>
      <a href="#idReset" class="sidebar-item flex items-center px-4 py-3 text-white hover:text-cyan-400" data-section="idReset">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        ID RESET
      </a>
      <a href="#profile" class="sidebar-item flex items-center px-4 py-3 text-white hover:text-cyan-400" data-section="profile">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        PROFILE
      </a>
      <a href="#settings" class="sidebar-item flex items-center px-4 py-3 text-white hover:text-cyan-400" data-section="settings">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Settings
      </a>
    </nav>
    <button class="mt-4 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md transition-colors fixed bottom-4">
      Logout
    </button>
  </aside>

  <main class="pt-20 pb-8 px-4 md:px-8 ml-0 md:ml-64 transition-all duration-300">
    <div id="wordGenarate">
      <div class="max-w-3xl mx-auto p-4 rounded shadow min-w-full divide-y divide-cyan-400 rounded-lg overflow-hidden shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Text Input and Processing</h1>

        <!-- File input -->
        <div class="mb-4 neon-box mt-4 neon-glow p-4 rounded-lg">
          <label for="fileInput" class="block mb-1 font-semibold text-gray-700 cursor-pointer flex items-center">
            Upload Files
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-2" fill="none" viewBox="0 0 24 24" stroke="#fff">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
          </label>
          <input id="fileInput" type="file" multiple class="hidden"/>
        </div>

        <!-- Textarea input -->
        <div class="bg-gray-900/50 p-2 rounded-lg neon-box">
          <textarea id="textInput" spellcheck="false" class="textarea-neon bg-black w-full h-40 p-3 border-gray-800 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your text here..."></textarea>
        </div>
      </div>

      <!-- Processed Words & Stats -->
      <div class="max-w-3xl mx-auto p-2 rounded-lg min-w-full divide-y divide-cyan-400 rounded-lg overflow-hidden shadow-lg mt-4">
        <div class="flex items-center justify-between mb-2 w-full bg-black p-2 border-t">
          <h2 class="text-lg font-semibold">Processed Words</h2>
          <!-- Copy Button -->
          <button type="button" id="copyBtn" class="p-2 hover:bg-gray-800 rounded" aria-label="Copy generated words" title="Copy generated words">
            <!-- SVG for copy -->
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
              <g fill="#fff">
                <path d="M32 2H8C5.79 2 4 3.79 4 6v28h4V6h24V2zm6 8H16c-2.21 0-4 1.79-4 4v28c0 2.21 1.79 4 4 4h22c2.21 0 4-1.79 4-4V14c0-2.21-1.79-4-4-4zm0 32H16V14h22v28z"/>
              </g>
            </svg>
          </button>
        </div>
        <div id="wordListContainer" class="bg-gray-900/50 p-3 rounded-lg mb-4 h-48 overflow-y-auto">
          <p class="text-gray-400">Processed words will appear here...</p>
        </div>
        <!-- Stats -->
        <div class="bg-gray-900/50 p-6 rounded-lg neon-box">
          <div class="flex justify-between mt-4 space-x-4 text-sm text-gray-600">
            <div><strong>Word Count:</strong> <span id="wordStats" class="text-3xl neon-glow cursor-pointer p-2 m-2 text-black">0</span></div>
            <div><strong>Member Codes:</strong> <span id="memberStats" class="text-3xl neon-glow cursor-pointer p-2 m-2 text-black">0</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Section -->
    <section id="dashboard" class="content-section active">
      <div class="p-3 bg-gray-800 rounded-lg neon-box text-white mt-4 mb-4">
        <h2 class="uppercase text-2xl font-bold mb-4 neon-glow border-b border-gray-100 pb-3">Dashboard Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <button class="bg-black p-4 rounded-lg neon-box neon-glow text-xl uppercase text-shadow text-black">Button</button>
        </div>
      </div>
    </section>

    <!-- Profile Section -->
    <section id="profile" class="content-section">
      <div class="p-3 bg-gray-800 rounded-lg neon-box text-white mt-4 mb-4">
        <h2 class="uppercase text-2xl font-bold mb-4 neon-glow border-b border-gray-100 pb-3">Profile Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <button class="bg-black p-4 rounded-lg neon-box neon-glow text-xl uppercase text-shadow text-black">Button</button>
        </div>
      </div>
    </section>

    <!-- AttackPage Section -->
    <section id="attackPage" class="content-section">
      <div class="p-3 bg-gray-800 rounded-lg neon-box text-white mt-4 mb-4">
        <h2 class="uppercase text-2xl font-bold mb-4 neon-glow border-b border-gray-100 pb-3">AttackPage Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <button class="bg-black p-4 rounded-lg neon-box neon-glow text-xl uppercase text-shadow text-black">Button</button>
        </div>
      </div>
    </section>

    <!-- idReset Section -->
    <section id="idReset" class="content-section">
      <div class="p-3 bg-gray-800 rounded-lg neon-box text-white mt-4 mb-4">
        <h2 class="uppercase text-2xl font-bold mb-4 neon-glow border-b border-gray-100 pb-3">idReset Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <button class="bg-black p-4 rounded-lg neon-box neon-glow text-xl uppercase text-shadow text-black">Button</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script id="xs"></script>
  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
      setTimeout(updateClock, 1000);
    }
    updateClock();

    // Sidebar toggle
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebar = document.getElementById('sidebar');
    let sidebarOpen = window.innerWidth >= 768;

    function updateSidebar() {
      if (sidebarOpen) {
        sidebar.classList.remove('-translate-x-full');
      } else {
        sidebar.classList.add('-translate-x-full');
      }
    }

    if (window.innerWidth < 768) {
      sidebarOpen = false;
    }

    sidebarToggle.addEventListener('click', () => {
      sidebarOpen = !sidebarOpen;
      updateSidebar();
    });

    // Content section navigation
    const sidebarItems = document.querySelectorAll('.sidebar-item');
    const contentSections = document.querySelectorAll('.content-section');

    sidebarItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        // Remove active class from all
        sidebarItems.forEach(i => i.classList.remove('active'));
        // Add to clicked
        item.classList.add('active');

        // Show corresponding section
        const sectionId = item.getAttribute('data-section');
        contentSections.forEach(section => {
          section.classList.remove('active');
        });
        const targetSection = document.getElementById(sectionId);
        if (targetSection) {
          targetSection.classList.add('active');
        }

        // Close sidebar on mobile
        if (window.innerWidth < 768) {
          sidebar.classList.add('-translate-x-full');
        }
      });
    });

    // File input
    const fileInput = document.getElementById('fileInput');
    if (fileInput) {
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          alert(`Selected ${e.target.files.length} file(s)`);
        }
      });
    }

    // Responsive resize
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        sidebar.classList.remove('-translate-x-full');
      } else {
        sidebar.classList.add('-translate-x-full');
      }
    });

    // Member details (assuming you have such elements)
    function viewMemberDetails() {
      const jsonTableButton = document.getElementById('jsonTable');
      if (jsonTableButton) {
        jsonTableButton.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.closest('tr')?.querySelector('td')?.textContent;
            if (id) alert('User ID: ' + id);
          });
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      viewMemberDetails();
      // Fetch external script
      xyz();
    });

    async function xyz() {
      const xyzUrl = "https://hckrxyzz.github.io/js/createbutton.js";
      try {
        const res = await fetch(xyzUrl);
        const data = await res.text();
        document.getElementById('xs').innerText = data;
      } catch (err) {
        console.error('Failed to fetch external script:', err);
      }
    }

    // Copy generated words
    document.getElementById('copyBtn')?.addEventListener('click', () => {
      const wordContainer = document.getElementById('wordListContainer');
      const text = wordContainer.innerText || wordContainer.textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
      });
    });
  </script>
  <script src="https://hckrxyzz.github.io/js/scrollbutton.js"></script>
</body>
</html>
