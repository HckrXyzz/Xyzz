<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ATTACK 2.0</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://hckrxyzz.github.io/Xyzz/attack.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .main-button {
  height: 70px;
  margin-bottom: 20px;
  font-size: 36px;
  font-weight: bolder;
  --transition: 350ms;
  --folder-W: 120px;
  --folder-H: 80px;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  box-shadow: 3px 3px 10px rgba(0, 0, 0, 1), -1px -1px 6px rgba(81, 75, 75, 0.4);
  position: relative;
  color: #c00f35;
  text-align: center;
  background: rgba(255, 255, 255, 0.2);
  border: none;
  border-radius: 10px;
  text-shadow: 3px 3px 10px rgba(0, 0, 0, 1),
    -1px -1px 6px rgba(255, 255, 255, 0.4);
  cursor: pointer;
  display: inline-block;
  width: 100%;
  padding: 10px 35px;
  position: relative;
  text-shadow: #3c0dbf;
}
.main-button:hover {
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 3px 3px 10px rgba(0, 0, 0, 1),
    -1px -1px 6px rgba(255, 255, 255, 0.4);
  color: #c00f35;
  text-shadow: #3c0dbf;
}
.main-button:active {
  background: rgba(255, 255, 255, 0.6);
  box-shadow: 3px 3px 10px rgba(0, 0, 0, 1),
    -1px -1px 6px rgba(255, 255, 255, 0.4);
  color: #c00f35;
  text-shadow: #3c0dbf;
}
.footer-btns {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
  width: 100%;
  bottom: 0;
  position: fixed;
}
.no-margin {
  margin: 0;
}
.margin {
  margin: 20px;
}
.margin-top {
  margin-top: 20px;
}
.margin-bottom {
  margin-bottom: 20px;
}
.margin-left {
  margin-left: 20px;
}
.margin-right {
  margin-right: 20px;
}
.main-content {
  margin-top: 100px;
  margin-bottom: 100px;
}
.hidden {
  display: none;
}
.fixed {
  position: fixed;
  z-index: 9999;
  display: block;
}
.svg-img {
  max-width: 30px;
  max-height: 30px;
  background-image: url("https://cdn-icons-png.flaticon.com/512/25/25657.png");
}
.svg-img2 {
  max-width: 30px;
  max-height: 30px;
}
.test-btn {
  margin: 10px;
  width: 200px;
  height: 50px;
  padding: 10px;
  background-color: #3c0dbf;
  color: #fff;
  border: none;
}
.balance-blue {
  color: #3c0dbf;
  font-size: 18px;
  font-weight: bolder;
  text-align: center;
  text-shadow: 3px 3px 10px rgb(215, 7, 7);
  background: rgba(255, 255, 255, 0.2);
  text-decoration: underline;
}
th,td,tr,table,thead,tbody {
  border: 1px solid #000;
}
    </style>
</head>

<body>
    <header>
        <div id="loading" class="loader_container">
            <div class="item_loader item-1"></div>
            <div class="item_loader item-2"></div>
            <div class="item_loader item-3"></div>
            <div class="item_loader item-4"></div>
        </div>
        <button type="button" class="fixed-button go-down-bottom"
            onclick="window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });">⬇️</button>
    </header>
    <div class="body">
        <div class="container">
            <div class="folder">
                <div class="front-side">
                    <div class="tip"></div>
                    <div class="cover"></div>
                    <div class="back-side cover"></div>
                    <label for="fileInput">Upload</label>
                    <input oninput="generateWordList()" id="fileInput" class="custom-file-upload" type="file" title="" />
                </div>
                <label for="textInput"></label>
                <input class="text-input" oninput="generateWordList()" id="textInput" type="text"
                    placeholder="Enter text here">
            </div>
        </div>
        <button class="clear-btn btn btn-close" type="button" id="clearButton">❌</button>
        <div class="output-container" id="output"></div>
        <button type="button" id="downloadBtn" class="btn download_button btn-link" onclick="downloadResponses()" style="display:none;">Download</button>

        <div class="error-output" id="errorOutput"></div>
        <div id="successContainer">
            <div id="successOutput"></div>
        </div>
        <div class="word_list" onchange="sortWordListAscending()" id="wordList"></div>
    </div>

    <footer>
        <nav>
            <ul>
                <li>
                    <button id="attackButton" type="button" class="main-button button-63"
                        onclick="processLoginFile()">Attack</button>
                    <button id="attackstopButton" type="button" class="main-button button-63" style="display: none;"
                        onclick="stopLoginAttempts()">STOP</button>
                </li>
            </ul>
            <button type="button" class="fixed-button go-top-bottom"
                onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">🔝</button>
        </nav>
    </footer>
<script src="Attack.js"></script>
</body>
</html>
