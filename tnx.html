    <script>
      const tnxIds = document.querySelectorAll(".button");
      const displayElement = document.getElementById("clicked-list-display");

      const updateDisplay = () => {
        const savedIds = JSON.parse(localStorage.getItem("clickIds")) || [];
        displayElement.innerText =
          savedIds.length > 0
            ? "You clicked: " + savedIds.join(", ")
            : "You clicked: None";
      };

      // Initialize display
      updateDisplay();

      tnxIds.forEach((idElement) => {
        idElement.addEventListener("click", () => {
          const textToCopy = idElement.innerText;

          // Update LocalStorage
          let savedIds = JSON.parse(localStorage.getItem("clickIds")) || [];
          if (!savedIds.includes(textToCopy)) {
            savedIds.push(textToCopy);
            localStorage.setItem("clickIds", JSON.stringify(savedIds));
            updateDisplay();
          }

          // Clipboard API
          navigator.clipboard
            .writeText(textToCopy)
            .then(() => {
              const originalText = idElement.textContent;
              idElement.textContent = "Copied!";
              setTimeout(() => {
                idElement.textContent = originalText;
              }, 1500);
            })
            .catch((err) => console.error("Failed to copy: ", err));
        });
      });
    </script>
  </body>
</html>
